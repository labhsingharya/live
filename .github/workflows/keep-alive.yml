name: Auto Ping Service

on:
  schedule:
    # यह हर 10 मिनट पर आपके ऐप को पिंग करेगा (आप इसे अपने हिसाब से बदल सकते हैं)
    - cron: '*/10 * * * *'
  workflow_dispatch: # इससे आप इसे बटन दबाकर मैन्युअल भी चला सकते हैं

jobs:
  ping:
  # यह फ्री लिनक्स सर्वर पर चलेगा
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          curl -I https://ldtfor.onrender.com/
          
      - name: Ping Hugging Face Space
        run: |
          # अगर आपके पास Hugging Face का यूआरएल है, तो उसे यहाँ डालें (नहीं तो इस हिस्से को हटा सकते हैं)
          curl -I https://ldtadmin-forwarder.hf.space/
